name: evodox-target

services:
  db:
    image: postgres:16.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evodox}
      POSTGRES_USER: ${POSTGRES_USER:-evodox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-evodox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 5s
      retries: 5

  object-storage:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio-data:/data
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  object-storage-init:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: "no"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "mc alias set local http://object-storage:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/uploads && mc anonymous set public local/uploads"
    depends_on:
      object-storage:
        condition: service_healthy

  auth:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--http-port=18080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-evodox}
      KC_DB_USERNAME: ${POSTGRES_USER:-evodox}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/127.0.0.1/18080'"]
      interval: 15s
      timeout: 5s
      retries: 12

  retention-preflight:
    image: ${EVODOX_IMAGE:?required}
    restart: "no"
    command: ["/bin/sh", "-lc", "RETENTION_VALIDATE_ENV_ONLY=true python -m evodox.runtime.retention_scheduler_runner"]
    environment:
      RETENTION_VALIDATE_ENV_ONLY: "true"
      RETENTION_DB_PATH: /runtime/jobs.db
      RETENTION_SCHEDULER_LOCK_OWNER: ${RETENTION_SCHEDULER_LOCK_OWNER:-retention-runner-01}
      RETENTION_SCHEDULER_INTERVAL_SECONDS: ${RETENTION_SCHEDULER_INTERVAL_SECONDS:-300}
      RETENTION_SCHEDULER_BATCH_SIZE: ${RETENTION_SCHEDULER_BATCH_SIZE:-100}
      RETENTION_SCHEDULER_LEASE_TTL_SECONDS: ${RETENTION_SCHEDULER_LEASE_TTL_SECONDS:-300}
      RETENTION_SCHEDULER_HEARTBEAT_SECONDS: ${RETENTION_SCHEDULER_HEARTBEAT_SECONDS:-60}
      RETENTION_TENANT_IDS: ${RETENTION_TENANT_IDS:?required}
      RETENTION_AUDIT_LOG_PATH: /runtime/audit/retention-audit.jsonl
      RETENTION_OBJECT_STORAGE_BACKEND: s3
      RETENTION_OBJECT_STORAGE_S3_BUCKET: ${RETENTION_OBJECT_STORAGE_S3_BUCKET:-evodox-jobs}
      RETENTION_OBJECT_STORAGE_S3_ENDPOINT: http://object-storage:9000
      RETENTION_OBJECT_STORAGE_S3_REGION: ${RETENTION_OBJECT_STORAGE_S3_REGION:-us-east-1}
      RETENTION_OBJECT_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      RETENTION_OBJECT_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      RETENTION_OBJECT_STORAGE_S3_FORCE_PATH_STYLE: "true"
      RETENTION_RECOVERY_MAPPING_VERSION: v1
    depends_on:
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/runtime

  api:
    image: ${EVODOX_IMAGE:?required}
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "evodox.runtime.api_app:create_app", "--factory", "--host", "0.0.0.0", "--port", "18000"]
    env_file:
      - ../.env
    environment:
      API_DB_PATH: /runtime/jobs.db
      API_AUDIT_LOG_PATH: /runtime/audit/api-audit.jsonl
      API_UPLOAD_BASE_URL: ${API_UPLOAD_BASE_URL:-http://localhost:19000}
      API_UPLOAD_BUCKET: uploads
      API_AUTH_MODE: ${API_AUTH_MODE:-dev}
      API_OBJECT_STORAGE_MODE: ${API_OBJECT_STORAGE_MODE:-stub}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      retention-preflight:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ${EVODOX_IMAGE:?required}
    restart: unless-stopped
    command: ["python", "-m", "evodox.runtime.worker_runner"]
    gpus: all
    env_file:
      - ../.env
    environment:
      WORKER_DB_PATH: /runtime/jobs.db
      WORKER_MODE: ${WORKER_MODE:-whisperx}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_AUDIT_LOG_PATH: /runtime/audit/worker-audit.jsonl
      WORKER_OBJECT_STORAGE_BASE_URL: ${WORKER_OBJECT_STORAGE_BASE_URL:-http://object-storage:9000}
      WORKER_OBJECT_STORAGE_BUCKET: ${WORKER_OBJECT_STORAGE_BUCKET:-uploads}
      WORKER_WHISPERX_MODEL: ${WORKER_WHISPERX_MODEL:-tiny}
      WORKER_WHISPERX_DEVICE: ${WORKER_WHISPERX_DEVICE:-cuda}
      WORKER_WHISPERX_COMPUTE_TYPE: ${WORKER_WHISPERX_COMPUTE_TYPE:-float16}
      WORKER_WHISPERX_DEVICE_INDEX: ${WORKER_WHISPERX_DEVICE_INDEX:-0}
      WORKER_WHISPERX_BATCH_SIZE: ${WORKER_WHISPERX_BATCH_SIZE:-4}
      WORKER_ALLOWED_QUEUES: ${WORKER_ALLOWED_QUEUES:-}
      WORKER_WHISPERX_MODEL_DIR: ${WORKER_WHISPERX_MODEL_DIR:-/runtime/models}
      WORKER_NLTK_DATA_DIR: ${WORKER_NLTK_DATA_DIR:-/runtime/nltk_data}
      WORKER_OFFLINE_STRICT: ${WORKER_OFFLINE_STRICT:-false}
      HF_HUB_OFFLINE: ${WORKER_HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${WORKER_TRANSFORMERS_OFFLINE:-0}
      WORKER_WHISPERX_DIARIZATION_MODEL: ${WORKER_WHISPERX_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      WORKER_ENABLE_DIARIZATION: ${WORKER_ENABLE_DIARIZATION:-true}
      WORKER_WHISPERX_VAD_METHOD: ${WORKER_WHISPERX_VAD_METHOD:-silero}
      WORKER_MEDIA_TEMP_DIR: ${WORKER_MEDIA_TEMP_DIR:-/tmp/evodox-worker}
      WORKER_WHISPERX_TIMEOUT_SECONDS: ${WORKER_WHISPERX_TIMEOUT_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      retention-preflight:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker healthy')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-cpu:
    image: ${EVODOX_IMAGE:?required}
    restart: unless-stopped
    profiles: ["multi-gpu"]
    command: ["python", "-m", "evodox.runtime.worker_runner"]
    env_file:
      - ../.env
    environment:
      WORKER_DB_PATH: /runtime/jobs.db
      WORKER_MODE: whisperx
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_AUDIT_LOG_PATH: /runtime/audit/worker-audit.jsonl
      WORKER_OBJECT_STORAGE_BASE_URL: ${WORKER_OBJECT_STORAGE_BASE_URL:-http://object-storage:9000}
      WORKER_OBJECT_STORAGE_BUCKET: ${WORKER_OBJECT_STORAGE_BUCKET:-uploads}
      WORKER_WHISPERX_MODEL: ${WORKER_WHISPERX_MODEL:-tiny}
      WORKER_WHISPERX_DEVICE: cpu
      WORKER_WHISPERX_COMPUTE_TYPE: int8
      WORKER_WHISPERX_DEVICE_INDEX: 0
      WORKER_WHISPERX_BATCH_SIZE: ${WORKER_WHISPERX_BATCH_SIZE:-4}
      WORKER_ALLOWED_QUEUES: cpu-short
      WORKER_WHISPERX_MODEL_DIR: ${WORKER_WHISPERX_MODEL_DIR:-/runtime/models}
      WORKER_NLTK_DATA_DIR: ${WORKER_NLTK_DATA_DIR:-/runtime/nltk_data}
      WORKER_OFFLINE_STRICT: ${WORKER_OFFLINE_STRICT:-false}
      HF_HUB_OFFLINE: ${WORKER_HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${WORKER_TRANSFORMERS_OFFLINE:-0}
      WORKER_WHISPERX_DIARIZATION_MODEL: ${WORKER_WHISPERX_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      WORKER_ENABLE_DIARIZATION: ${WORKER_ENABLE_DIARIZATION:-true}
      WORKER_WHISPERX_VAD_METHOD: ${WORKER_WHISPERX_VAD_METHOD:-silero}
      WORKER_MEDIA_TEMP_DIR: ${WORKER_MEDIA_TEMP_DIR:-/tmp/evodox-worker}
      WORKER_WHISPERX_TIMEOUT_SECONDS: ${WORKER_WHISPERX_TIMEOUT_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      retention-preflight:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker-cpu healthy')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-gpu-0:
    image: ${EVODOX_IMAGE:?required}
    restart: unless-stopped
    profiles: ["multi-gpu"]
    command: ["python", "-m", "evodox.runtime.worker_runner"]
    gpus: all
    env_file:
      - ../.env
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      WORKER_DB_PATH: /runtime/jobs.db
      WORKER_MODE: whisperx
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_AUDIT_LOG_PATH: /runtime/audit/worker-audit.jsonl
      WORKER_OBJECT_STORAGE_BASE_URL: ${WORKER_OBJECT_STORAGE_BASE_URL:-http://object-storage:9000}
      WORKER_OBJECT_STORAGE_BUCKET: ${WORKER_OBJECT_STORAGE_BUCKET:-uploads}
      WORKER_WHISPERX_MODEL: ${WORKER_WHISPERX_MODEL:-tiny}
      WORKER_WHISPERX_DEVICE: cuda
      WORKER_WHISPERX_COMPUTE_TYPE: float16
      WORKER_WHISPERX_DEVICE_INDEX: 0
      WORKER_WHISPERX_BATCH_SIZE: ${WORKER_WHISPERX_BATCH_SIZE:-4}
      WORKER_ALLOWED_QUEUES: gpu-standard,gpu-long
      WORKER_WHISPERX_MODEL_DIR: ${WORKER_WHISPERX_MODEL_DIR:-/runtime/models}
      WORKER_NLTK_DATA_DIR: ${WORKER_NLTK_DATA_DIR:-/runtime/nltk_data}
      WORKER_OFFLINE_STRICT: ${WORKER_OFFLINE_STRICT:-false}
      HF_HUB_OFFLINE: ${WORKER_HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${WORKER_TRANSFORMERS_OFFLINE:-0}
      WORKER_WHISPERX_DIARIZATION_MODEL: ${WORKER_WHISPERX_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      WORKER_ENABLE_DIARIZATION: ${WORKER_ENABLE_DIARIZATION:-true}
      WORKER_WHISPERX_VAD_METHOD: ${WORKER_WHISPERX_VAD_METHOD:-silero}
      WORKER_MEDIA_TEMP_DIR: ${WORKER_MEDIA_TEMP_DIR:-/tmp/evodox-worker}
      WORKER_WHISPERX_TIMEOUT_SECONDS: ${WORKER_WHISPERX_TIMEOUT_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      retention-preflight:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker-gpu-0 healthy')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-gpu-1:
    image: ${EVODOX_IMAGE:?required}
    restart: unless-stopped
    profiles: ["multi-gpu"]
    command: ["python", "-m", "evodox.runtime.worker_runner"]
    gpus: all
    env_file:
      - ../.env
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
      WORKER_DB_PATH: /runtime/jobs.db
      WORKER_MODE: whisperx
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_AUDIT_LOG_PATH: /runtime/audit/worker-audit.jsonl
      WORKER_OBJECT_STORAGE_BASE_URL: ${WORKER_OBJECT_STORAGE_BASE_URL:-http://object-storage:9000}
      WORKER_OBJECT_STORAGE_BUCKET: ${WORKER_OBJECT_STORAGE_BUCKET:-uploads}
      WORKER_WHISPERX_MODEL: ${WORKER_WHISPERX_MODEL:-tiny}
      WORKER_WHISPERX_DEVICE: cuda
      WORKER_WHISPERX_COMPUTE_TYPE: float16
      WORKER_WHISPERX_DEVICE_INDEX: 0
      WORKER_WHISPERX_BATCH_SIZE: ${WORKER_WHISPERX_BATCH_SIZE:-4}
      WORKER_ALLOWED_QUEUES: gpu-standard,gpu-long
      WORKER_WHISPERX_MODEL_DIR: ${WORKER_WHISPERX_MODEL_DIR:-/runtime/models}
      WORKER_NLTK_DATA_DIR: ${WORKER_NLTK_DATA_DIR:-/runtime/nltk_data}
      WORKER_OFFLINE_STRICT: ${WORKER_OFFLINE_STRICT:-false}
      HF_HUB_OFFLINE: ${WORKER_HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${WORKER_TRANSFORMERS_OFFLINE:-0}
      WORKER_WHISPERX_DIARIZATION_MODEL: ${WORKER_WHISPERX_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      WORKER_ENABLE_DIARIZATION: ${WORKER_ENABLE_DIARIZATION:-true}
      WORKER_WHISPERX_VAD_METHOD: ${WORKER_WHISPERX_VAD_METHOD:-silero}
      WORKER_MEDIA_TEMP_DIR: ${WORKER_MEDIA_TEMP_DIR:-/tmp/evodox-worker}
      WORKER_WHISPERX_TIMEOUT_SECONDS: ${WORKER_WHISPERX_TIMEOUT_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      retention-preflight:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "print('worker-gpu-1 healthy')"]
      interval: 30s
      timeout: 5s
      retries: 3

  retention-runner:
    image: ${EVODOX_IMAGE:?required}
    restart: unless-stopped
    command: ["python", "-m", "evodox.runtime.retention_scheduler_runner"]
    env_file:
      - ../.env
    environment:
      RETENTION_VALIDATE_ENV_ONLY: "false"
    depends_on:
      db:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      retention-preflight:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; Path('/tmp/retention-runner-health').touch(); print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18081:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  runtime-data:
